name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            # SimonAB CausalInference allows GraphMakie 0.6 (registry CI does not).
            # SimonAB DAGMakie (≥0.1.1) falls back when GraphMakie lacks forked
            # attributes such as :nlabels_align_processed.
            Pkg.add(url="https://github.com/SimonAB/CausalInference.jl.git")
            Pkg.add(url="https://github.com/SimonAB/DAGMakie.jl.git")
            Pkg.instantiate()'
      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          CI: "true"
        run: julia --project=docs docs/make.jl
