name: Documentation
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Install dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            # CausalInference ≥0.19.4 (General) allows GraphMakie 0.5–0.6.
            Pkg.add("CausalInference")
            # DAGMakie is already declared in docs/Project.toml (and its
            # [sources] entry pins the documentation-compatible repository).
            # Re-adding it here can make Julia 1.13 retain a stale path entry
            # from a developer Manifest and fail before Documenter starts.
            Pkg.resolve()
            Pkg.instantiate()'
      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          CI: "true"
        run: julia --project=docs docs/make.jl
