name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      # Use a temporary env so developing DAGMakie does not rewrite Project.toml deps.
      # Drop the GitHub develop once DAGMakie is on General and listed under [extras].
      - name: Test with optional DAGMakie
        run: |
          julia --startup-file=no --threads=auto -e '
            using Pkg
            Pkg.activate(temp=true)
            Pkg.develop(PackageSpec(path=pwd()))
            try
              Pkg.add(PackageSpec(name="DAGMakie"))
            catch
              @info "DAGMakie not on General; developing from GitHub"
              Pkg.develop(PackageSpec(url="https://github.com/SimonAB/DAGMakie.jl.git"))
            end
            Pkg.test("CausalDynamics"; coverage=true)
          '
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
